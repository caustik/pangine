[package]
name = "pangine"
version = "1.0.0"
edition = "2021"
authors = ["Aaron Robinson"]
description = "An experimental language for asking questions of remembered experience, with exact and graded answers that keep their sources"
readme = "README.md"
repository = "https://github.com/caustik/pangine"
homepage = "https://pangine.com"
license = "MIT OR Apache-2.0"
keywords = ["grammar", "semantics", "knowledge-representation", "ai"]
categories = ["data-structures", "parser-implementations"]
publish = false

[workspace]
members = [".", "bindings/wasm"]
default-members = [".", "bindings/wasm"]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
im = "15.1.0"
